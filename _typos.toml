# typos (spell checker). Keep exceptions narrow: prefer whole identifiers over bare words.
[files]
extend-exclude = ["pixi.lock"]

[default]
extend-ignore-re = [
    "\\b[0-9a-f]{7,64}\\b",  # git SHAs and sha256 digests (action pins, data pins)
    "re-actors/alls-green",  # GitHub Action name
]

[default.extend-identifiers]
# ClickBench `hits` column names, misspelled upstream; they must match the dataset schema.
IsArtifical = "IsArtifical"
TraficSourceID = "TraficSourceID"
# Deliberate misspelling in lexer/parser/session negative tests.
SELEC = "SELEC"
