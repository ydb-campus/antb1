# Weekly pixi.lock refresh as a PR from the organization GitHub App `antb1-bot` (ADR 0009, docs/agents.md). A PR
# opened with the App's token triggers CI like any member's PR (a PR opened with GITHUB_TOKEN would not), and it
# still needs one human approval. Inert until the App exists: the job runs only when the repository variable
# BOT_CLIENT_ID is set; the private key BOT_PRIVATE_KEY is a secret of the `automation` environment, which only
# `main` can use. The lock is regenerated with pixi 0.81.0 only (lock format `version: 7`, check_repo.py R005).
name: pixi.lock update

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: pixi update
    if: vars.BOT_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: automation
    permissions:
      contents: read # checkout; the App token (not this one) pushes the branch and opens the PR
    steps:
      - id: app-token
        name: App token (contents and pull requests, this repository only)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # create-pull-request pushes with the App token itself
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false # only the pixi binary: `pixi update` re-solves without installing environments
          # No environment is installed, so no cache is restored or saved. `cache: false` cannot be combined with
          # the cache key that check_repo.py R010 requires on every setup-pixi step (setup-pixi rejects the pair).
          cache-key: pixi-${{ hashFiles('pixi.lock') }}-
          cache-write: false
      - name: Update pixi.lock (pixi update)
        run: |
          set -o pipefail
          pixi update --json --no-install >"$RUNNER_TEMP/pixi-update.json"
          body="$RUNNER_TEMP/pixi-update.md"
          if git diff --quiet -- pixi.lock; then
            echo "pixi.lock is already up to date." | tee "$body"
          else
            # Run outside the workspace, so `pixi exec` does not pick up this repository's manifest.
            (cd "$RUNNER_TEMP" && pixi exec --spec pixi-diff-to-markdown==0.3.9 pixi-diff-to-markdown \
              <pixi-update.json >"$body")
          fi
          {
            echo
            echo "Generated by \`.github/workflows/pixi-lock-update.yml\` with pixi 0.81.0. CI runs as for any PR;"
            echo "a maintainer reviews the diff, approves and squash-merges."
          } >>"$body"
      # Not `gh pr create`: the action signs the commit through the API and reuses, updates or closes one PR branch.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1 # zizmor: ignore[superfluous-actions]
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/pixi-lock-update
          title: "build(deps): update pixi.lock"
          commit-message: "build(deps): update pixi.lock"
          body-path: ${{ runner.temp }}/pixi-update.md
          labels: dependencies,pixi
          add-paths: pixi.lock
          sign-commits: true
          delete-branch: true
