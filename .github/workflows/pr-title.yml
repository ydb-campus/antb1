# Required check: `PR title`. The PR title becomes the squash commit subject on main, so it must follow
# Conventional Commits with a lowercase subject, e.g. `feat(sql): parse LIMIT` or `ci: cache ccache per leg`.
# merge_group runs skip the check step (the title was validated on the PR) so the required check still reports.
name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read # the action reads the PR title
    steps:
      - name: Conventional Commits title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" of the PR title "{title}" must start with a lowercase letter,
            e.g. "feat(sql): parse LIMIT".
