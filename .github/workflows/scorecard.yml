# OpenSSF Scorecard: supply-chain checks of the repository, results in the Security tab and published to
# scorecard.dev. Advisory. Publishing requires Scorecard's workflow restrictions: no top-level env or defaults, no
# workflow-level write permissions, id-token only in this job, no job env, and only checkout, upload-artifact,
# codeql-action/upload-sarif and scorecard-action as steps. branch_protection_rule does not fire on ruleset edits;
# the weekly run covers them. Accepted findings: License (decided later) and admin bypass.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"
  branch_protection_rule:

permissions: {}

# One analysis per ref at a time (Scorecard allows workflow-level concurrency).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      actions: read # workflow runs, for the checks
      security-events: write # upload the SARIF results
      id-token: write # publish the results (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
