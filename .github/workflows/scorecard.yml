# OpenSSF Scorecard: supply-chain checks of the repository, results in the Security tab and published to
# scorecard.dev. Advisory. Publishing requires Scorecard's workflow restrictions: no top-level env or defaults, no
# workflow-level write permissions, id-token only in this job, no job env, and only checkout, upload-artifact,
# codeql-action/upload-sarif and scorecard-action as steps. branch_protection_rule does not fire on ruleset edits;
# the weekly run covers them. Accepted finding: admin bypass.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"
  branch_protection_rule:

permissions: {}

# One analysis per ref at a time (Scorecard allows workflow-level concurrency).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      actions: read # workflow runs, for the checks
      security-events: write # upload the SARIF results
      id-token: write # publish the results (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
