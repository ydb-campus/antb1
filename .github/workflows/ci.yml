# Required check: `CI OK` (the aggregator below). Every job name contains the local command that reproduces it;
# see docs/ci.md. Hardening rules (tools/lint/check_repo.py R010/R015, zizmor, actionlint): top-level
# `permissions: {}`, minimal per-job permissions, timeouts everywhere, SHA-pinned actions, no credentials left in
# .git, no `${{ github.event.* }}` in `run:`, caches written only from main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "30 2 * * *" # daily full run on main: the only run (with workflow_dispatch) that saves ccache; cache-gc
  workflow_dispatch:

permissions: {}

concurrency:
  # PRs share one group per PR number (a new push cancels the old run); every other event gets its own group,
  # so pushes and scheduled runs on main are never dropped.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (pixi run lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout; dependency-review compares the dependency graph of base and head
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          environments: lint
          locked: true
          cache: true
          cache-key: pixi-${{ hashFiles('pixi.lock') }}-
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Lint (pixi run lint)
        run: pixi run --frozen -e lint lint
      - name: Dependency review (PRs only; folded into lint to save a job slot)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  build-test:
    name: ${{ matrix.name }} (pixi run ${{ matrix.task }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        include:
          # Clang 23 (env `default`) is the primary compiler; GCC 15 (env `gcc`, linux-64 only) is a compatibility leg.
          - name: clang-asan
            os: ubuntu-24.04
            pixi_env: default
            task: asan
            preset: ci-asan
            parallel: 4
          - name: gcc-compat
            os: ubuntu-24.04
            pixi_env: gcc
            task: ci-gcc
            preset: ci-gcc
            parallel: 4
          - name: macos-release
            os: macos-15 # arm64: 3 cores, 7 GB RAM
            pixi_env: default
            task: release
            preset: ci-release
            parallel: 3
    env:
      CCACHE_MAXSIZE: 250M
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel }}
      PIXI_ENV: ${{ matrix.pixi_env }}
      TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          environments: ${{ matrix.pixi_env }}
          locked: true
          cache: true
          cache-key: pixi-${{ hashFiles('pixi.lock') }}-
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache # CCACHE_DIR of every build preset (CMakePresets.json)
          key: ccache-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.name }}-
      - name: Build and test
        run: pixi run --frozen -e "$PIXI_ENV" "$TASK"
      - name: Save ccache (main, scheduled or manual runs only)
        if: >-
          ${{ !cancelled() && github.ref == 'refs/heads/main'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-${{ matrix.name }}-${{ github.run_id }}
      - name: Test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: build/${{ matrix.preset }}/junit.xml
          annotate_only: true
          job_summary: true
          detailed_summary: true
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.name }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/LastTest*.log
            build/${{ matrix.preset }}/junit.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: Disk usage
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Disk usage'
            echo '```text'
            df -h .
            du -sh .pixi build .cache 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # clang-tidy runs as the compiler launcher of the `tidy` preset, which disables ccache (ANTB1_USE_CCACHE=OFF),
  # so this job has no ccache steps; it has no tests, so no JUnit report or test logs either.
  clang-tidy:
    name: clang-tidy (pixi run tidy)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      TASK: tidy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          environments: default
          locked: true
          cache: true
          cache-key: pixi-${{ hashFiles('pixi.lock') }}-
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: clang-tidy
        run: pixi run --frozen -e default "$TASK"
      - name: Disk usage
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Disk usage'
            echo '```text'
            df -h .
            du -sh .pixi build 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The coverage gate (tools/ci/coverage_thresholds.json floors) and the libFuzzer smoke test of the SQL parser, both
  # Clang-only. The fuzz smoke runs even when coverage fails (`!cancelled()`), so one run reports both.
  clang-coverage-fuzz:
    name: clang-coverage-fuzz (pixi run coverage && pixi run fuzz-smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    env:
      CCACHE_MAXSIZE: 250M
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          environments: default
          locked: true
          cache: true
          cache-key: pixi-${{ hashFiles('pixi.lock') }}-
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache # CCACHE_DIR of every build preset (CMakePresets.json)
          key: ccache-clang-coverage-fuzz-${{ github.run_id }}
          restore-keys: ccache-clang-coverage-fuzz-
      - name: Coverage (pixi run coverage)
        run: pixi run --frozen -e default coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f build/coverage/summary.md ]; then
            cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Coverage: no summary (the build or the tests failed before the report)' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: build/coverage/summary.md
          retention-days: 7
          if-no-files-found: ignore
      - name: Fuzz smoke (pixi run fuzz-smoke)
        id: fuzz
        if: ${{ !cancelled() }}
        run: pixi run --frozen -e default fuzz-smoke
      - name: Save ccache (main, scheduled or manual runs only)
        if: >-
          ${{ !cancelled() && github.ref == 'refs/heads/main'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-clang-coverage-fuzz-${{ github.run_id }}
      - name: Test report (coverage)
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: build/coverage/junit.xml
          annotate_only: true
          job_summary: true
          detailed_summary: true
      - name: Test report (fuzz)
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: build/fuzz/junit.xml
          annotate_only: true
          job_summary: true
          detailed_summary: true
      # Crash, leak and timeout inputs found from our own seed corpus (never data); reproduce and turn one into a
      # regression with fuzz/regressions/README.md.
      - name: Upload fuzz artifacts
        if: ${{ failure() && steps.fuzz.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: build/fuzz/artifacts/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-clang-coverage-fuzz
          path: |
            build/coverage/Testing/Temporary/LastTest*.log
            build/coverage/junit.xml
            build/fuzz/Testing/Temporary/LastTest*.log
            build/fuzz/junit.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: Disk usage
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Disk usage'
            echo '```text'
            df -h .
            du -sh .pixi build .cache 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Advisory: posts (and then updates) one sticky comment with build/coverage/summary.md. Same-repo PRs only: a fork's
  # token cannot write comments, and this job never checks out or runs PR code.
  coverage-comment:
    name: coverage-comment
    needs: clang-coverage-fuzz
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: write # the sticky comment
    steps:
      # No summary when the build or the tests failed before the report: then there is nothing to post.
      - name: Download coverage summary
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-summary
      - name: Sticky coverage comment
        if: ${{ steps.download.outcome == 'success' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          path: summary.md

  # ClickBench data tests (label data): antb1 vs DuckDB on the pinned hits_0 partition, metamorphic relations on it
  # and the ClickBench ratchet (docs/testing.md#clickbench-data-tests). The data (122 MB, tools/data/clickbench.lock)
  # is cached under a key of its lock file; a miss downloads it, and only runs on main save it. Data-test output is
  # redacted and this job uploads nothing (no logs, no data: docs/adr/0006-test-strategy-and-data-policy.md).
  clickbench-hits0:
    name: clickbench-hits0 (pixi run test-data)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    env:
      ANTB1_DATA_DIR: ${{ github.workspace }}/.cache/clickbench
      CCACHE_MAXSIZE: 250M
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          environments: default
          locked: true
          cache: true
          cache-key: pixi-${{ hashFiles('pixi.lock') }}-
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache # CCACHE_DIR of every build preset (CMakePresets.json)
          key: ccache-clickbench-hits0-${{ github.run_id }}
          restore-keys: ccache-clickbench-hits0-
      - name: Restore ClickBench data
        id: data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/clickbench
          key: clickbench-${{ hashFiles('tools/data/clickbench.lock') }}
      - name: Fetch data (pixi run fetch-data)
        run: pixi run --frozen -e default fetch-data
      - name: Save ClickBench data (main only, on a cache miss)
        if: ${{ steps.data.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/clickbench
          key: clickbench-${{ hashFiles('tools/data/clickbench.lock') }}
      - name: Data tests (pixi run test-data)
        run: pixi run --frozen -e default test-data
      - name: Save ccache (main, scheduled or manual runs only)
        if: >-
          ${{ !cancelled() && github.ref == 'refs/heads/main'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-clickbench-hits0-${{ github.run_id }}
      - name: Test report (redacted)
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: build/ci-release/junit-data.xml
          annotate_only: true
          job_summary: true
          detailed_summary: true
      - name: Disk usage
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Disk usage'
            echo '```text'
            df -h .
            du -sh .pixi build .cache 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, build-test, clang-tidy, clang-coverage-fuzz, clickbench-hits0]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  # Keeps the Actions cache (10 GB per repository) small. After every run on main (not in the merge queue, not on
  # PRs, whose caches are read-only), it deletes the pixi caches of other pixi.lock generations, the ClickBench data
  # caches of other lock files and all but the newest ccache of each leg. Open PRs still on an old pixi.lock then
  # install their environments without a cache until they merge main. A run whose commit is no longer the head of
  # main does nothing: its lock files may be older than the caches that newer runs on main just wrote.
  cache-gc:
    name: cache-gc
    needs: [lint, build-test, clang-tidy, clang-coverage-fuzz, clickbench-hits0]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      actions: write # delete caches
      contents: read # sparse checkout of the two lock files (their hashes name the caches to keep)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            pixi.lock
            tools/data/clickbench.lock
          sparse-checkout-cone-mode: false
      - name: Delete stale caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PIXI_KEEP: pixi-${{ hashFiles('pixi.lock') }}-
          DATA_KEEP: clickbench-${{ hashFiles('tools/data/clickbench.lock') }}
        run: |
          set -euo pipefail
          # Never an empty hash (a missing lock file), which would match and delete every generation.
          [[ "$PIXI_KEEP" =~ ^pixi-[0-9a-f]{64}-$ && "$DATA_KEEP" =~ ^clickbench-[0-9a-f]{64}$ ]] || {
            echo "::error::cache-gc: no lock file hash ($PIXI_KEEP, $DATA_KEEP)"
            exit 1
          }
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main moved on ($GITHUB_SHA -> $head): the run on the new head collects the caches"
            exit 0
          fi
          delete() { xargs -r -n1 gh cache delete -R "$REPO"; }
          gh cache list -R "$REPO" --key pixi- --limit 1000 --json id,key \
            --jq '.[] | select(.key | startswith(env.PIXI_KEEP) | not) | .id' | delete
          gh cache list -R "$REPO" --key clickbench- --limit 100 --json id,key \
            --jq '.[] | select(.key != env.DATA_KEEP) | .id' | delete
          for leg in clang-asan gcc-compat macos-release clang-coverage-fuzz clickbench-hits0; do
            gh cache list -R "$REPO" --key "ccache-$leg-" --sort created_at --order desc --limit 100 --json id \
              --jq '.[1:][].id' | delete
          done
          gh cache list -R "$REPO" --limit 100 --json key,sizeInBytes \
            --jq '"### Caches after cache-gc", "", (.[] | "- \(.key): \(.sizeInBytes / 1048576 | floor) MiB")' \
            >> "$GITHUB_STEP_SUMMARY"
