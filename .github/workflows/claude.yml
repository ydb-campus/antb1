# `@claude` on issues and PRs (advisory; never a required check). Claude Code runs with the Claude GitHub App's token
# (obtained through OIDC, hence `id-token: write`); the workflow token itself stays read-only. See docs/agents.md.
# Guards against prompt injection and secret exposure:
#   - the job condition ignores bots and anything without `@claude` (or the issue label `claude`);
#   - the gate step requires write/maintain/admin for BOTH the sender and the issue or PR author, and refuses fork
#     PRs (members are private org members, so `author_association` cannot be used; the action checks the actor too);
#   - hooks are disabled and only the tools listed in --allowedTools run without a prompt, which in CI means they
#     are the only shell commands Claude can use (argument-less pixi tasks only: pixi does not escape quotes in
#     forwarded arguments, so `pixi run <task> *` would allow arbitrary commands; read-only git and gh); on PRs the
#     action restores
#     .claude/ and CLAUDE.md from the base branch, so the ask rules there become denials;
#   - every event value reaches the shell through `env:`, never through `${{ }}` inside `run:`.
# Not a sandbox: `pixi run build`/`test` execute the branch's code with this job's credentials, which is why the gate
# requires write access for the author as well as the sender.
# Billed as API usage through the ANTHROPIC_API_KEY secret (a key in a spend-capped Console workspace).
# Requirements: the Claude GitHub App is installed on the repository, the ANTHROPIC_API_KEY secret exists and
# this file is on the default branch (the token exchange fails with workflow_not_found_on_default_branch otherwise).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]

permissions: {}

jobs:
  claude:
    name: claude (@claude)
    if: >-
      github.event.sender.type != 'Bot' && (
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
      (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      # One run at a time per issue or PR; a second mention waits instead of cancelling work in progress.
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read # checkout; Claude pushes branches with the Claude App token, not with this one
      pull-requests: read # the gate reads the PR (fork check); the action reads PR context
      issues: read # the action reads the issue and its comments
      id-token: write # OIDC token exchanged for the Claude GitHub App token
      actions: read # additional_permissions: Claude reads CI runs and logs of the PR
    env:
      PIXI_LOCKED: "true" # a pixi.toml that disagrees with pixi.lock fails instead of silently re-locking
    steps:
      - name: Gate (sender and author need write access; no fork PRs)
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          AUTHOR: ${{ github.event.issue.user.login || github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.issue.user.type || github.event.pull_request.user.type }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ (github.event.issue.pull_request || github.event.pull_request) && 'true' || 'false' }}
          HAS_TOKEN: ${{ secrets.ANTHROPIC_API_KEY != '' }} # zizmor: ignore[secrets-outside-env] only a boolean
        run: |
          require_write() {
            local perm
            perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$1/permission" --jq .permission 2>/dev/null) ||
              perm=none
            case "$perm" in
              admin | maintain | write) ;;
              *)
                echo "::error::@claude needs write access for both the sender and the author; $1 has '$perm'"
                exit 1
                ;;
            esac
          }
          require_write "$SENDER"
          # Copilot's PRs have the bot account `Copilot` as author; the human sender was checked above.
          if [ "$AUTHOR" != Copilot ] || [ "$AUTHOR_TYPE" != Bot ]; then
            require_write "$AUTHOR"
          fi
          if [ "$IS_PR" = true ]; then
            cross=$(gh pr view "$NUMBER" -R "$GITHUB_REPOSITORY" --json isCrossRepository -q .isCrossRepository)
            if [ "$cross" != false ]; then
              echo "::error::@claude is disabled on pull requests from forks"
              exit 1
            fi
          fi
          if [ "$HAS_TOKEN" != true ]; then
            echo "::error::the ANTHROPIC_API_KEY secret is not set (docs/agents.md, Claude GitHub App and API key)"
            exit 1
          fi
          echo "gate: OK (sender $SENDER, author $AUTHOR)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false # the action configures git with the Claude App token itself
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          environments: default
          locked: true
          cache: true
          cache-key: pixi-${{ hashFiles('pixi.lock') }}-
          cache-write: false # only CI on main writes caches
      - name: Install the lint environment (pixi run lint, fmt and check)
        run: pixi install --locked -e lint
      - id: claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          # A repository secret, not an environment secret: review events run this job on the PR's merge ref, and an
          # environment that PR refs may use protects nothing. The gate above refuses forks and outsiders.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} # zizmor: ignore[secrets-outside-env]
          use_sticky_comment: true
          additional_permissions: |
            actions: read
          # Only named tasks, never `pixi run *` (pixi run executes arbitrary commands). The task list is checked by
          # tools/lint/check_repo.py (R001). Tasks of the `gcc` env and the slow `tidy` leg are left to CI.
          claude_args: |
            --max-turns 100
            --settings '{"disableAllHooks":true}'
            --allowedTools "Bash(pixi run configure),Bash(pixi run build),Bash(pixi run test),Bash(pixi run ci),Bash(pixi run asan),Bash(pixi run lint),Bash(pixi run fmt),Bash(pixi run check),Bash(pixi run doctor),Bash(git status),Bash(git diff),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr checks *),Bash(gh run view *),Bash(gh run list *),Bash(gh issue view *)"
      # The action hides Claude's output; on a failed run this step shows why (an API error such as an invalid key or
      # no credit, or Claude's last message) in the job summary and the log. The API key itself is never printed.
      - name: Report why Claude failed
        if: failure() && steps.claude.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          python3 - <<'PY'
          import json, os, secrets

          path = os.environ.get("EXECUTION_FILE", "")
          lines = ["### Claude run failed", ""]
          try:
              with open(path, encoding="utf-8") as f:
                  messages = json.load(f)
          except (OSError, ValueError) as e:
              messages = []
              lines.append(f"No readable execution file ({type(e).__name__}): the action stopped before Claude ran.")
          if not isinstance(messages, list):
              messages = []


          def clip(text, limit=2000):
              text = str(text)
              text = text if len(text) <= limit else text[:limit] + "..."
              return text.replace("```", "'''")


          # API errors arrive as an `error` field or as the text of the last assistant message ("API Error: ...").
          errors = [clip(m["error"]) for m in messages if isinstance(m, dict) and m.get("error")]
          texts = [
              c.get("text")
              for m in messages
              if isinstance(m, dict) and m.get("type") == "assistant"
              for c in ((m.get("message") or {}).get("content") or [])
              if isinstance(c, dict) and c.get("type") == "text" and c.get("text")
          ]
          result = next((m for m in reversed(messages) if isinstance(m, dict) and m.get("type") == "result"), None)
          if result is not None:
              lines.append(
                  f"Result: subtype `{result.get('subtype')}`, is_error `{result.get('is_error')}`, "
                  f"turns {result.get('num_turns')}, cost (USD) {result.get('total_cost_usd')}"
              )
              if result.get("result"):
                  errors.append(clip(result["result"]))
              for key in ("errors", "api_error_status"):
                  if result.get(key):
                      errors.append(clip(f"{key}: {json.dumps(result[key])}"))
          if errors:
              lines += ["", "Errors:", "", "```text", *errors, "```"]
          if texts:
              lines += ["", "Claude's last message:", "", "```text", clip(texts[-1]), "```"]
          if not errors and not texts and messages:
              lines += ["", "No error text in the execution file. Its last entries:", "", "```text"]
              lines += [clip(json.dumps(m), 500) for m in messages[-3:]]
              lines.append("```")
          report = "\n".join(lines) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(report)
          # Model and API text: workflow commands stay off while the report is printed.
          token = secrets.token_hex(16)
          print(f"::stop-commands::{token}\n{report}::{token}::", flush=True)
          PY
