# Sources of the static build (docs/adr/0033-standalone-static-binary.md), pinned by sha256 and size: Apache Arrow
# 25.0.0, the version pixi.lock pins for env `default`, and the dependencies Arrow bundles for the features
# cmake/static/arrow.cmake enables, at the versions and checksums of Arrow's cpp/thirdparty/versions.txt.
# `pixi run static-arrow` (scripts/static-sources.sh) downloads them once into $ANTB1_ARROW_DIR/src (default
# ~/.cache/antb1/arrow/src) and points each <variable> (Arrow's ARROW_<DEP>_URL) at the local file, so the Arrow
# build reads no network. An Arrow upgrade replaces every line (docs/recipes/dependency-update.md).
#
# One file per line: <name> <sha256> <bytes> <variable> <url> [<url>...]; `-` is Arrow's own source.
# - The pins (name, sha256, bytes, variable) come only from the ASF release: Arrow's from apache-arrow-<version>.tar.gz
#   checked against its .sha512 and its GPG signature (https://downloads.apache.org/arrow/KEYS), every other one from
#   that tarball's cpp/thirdparty/versions.txt. Never from a mirror: a mirror can only be checked against a pin.
# - The URLs are byte-identical copies of the pinned file, each one downloaded and checked; the first that serves the
#   pinned size and sha256 wins. Order: an uploaded GitHub release asset, then a generated GitHub archive, then copies
#   of other operators, last a single-server origin (archive.apache.org, zlib.net). Every file has copies of at least
#   two operators. A file name proves nothing: GitHub's tag archive of thrift is another file than its release.
# - `pixi run static-arrow --check-urls` checks every URL against its pin. URLs do not enter the prefix key.
