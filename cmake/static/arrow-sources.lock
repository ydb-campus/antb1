# Sources of the static build (docs/adr/0033-standalone-static-binary.md), pinned by sha256 and size: Apache Arrow
# 25.0.0, the version pixi.lock pins for env `default`, and the dependencies Arrow bundles for the features
# cmake/static/arrow.cmake enables, at the versions and checksums of Arrow's cpp/thirdparty/versions.txt.
# `pixi run static-arrow` (scripts/static-arrow.sh) downloads them once into $ANTB1_ARROW_DIR/src (default
# ~/.cache/antb1/arrow/src) and points each <variable> (Arrow's ARROW_<DEP>_URL) at the local file, so the Arrow
# build reads no network. An Arrow upgrade replaces every line (docs/recipes/dependency-update.md).
# One file per line: <name> <sha256> <bytes> <url> <variable>; `-` for Arrow's own source.
