# The source of the GNU C Library 2.28 that the Linux standalone binary links statically (LGPL-2.1-or-later;
# docs/adr/0034-licence-and-static-sources.md). Every Linux package comes with it: `pixi run static-sources`
# (scripts/static_package.py) puts it into antb1-<target>.sources.tar, and `pixi run static` refuses to package
# with a sysroot build that has no line here.
#
# One line per sysroot build that env `static` may lock: <sysroot build> <source file> <sha256> <bytes> <url> [<url>...]
# - <sysroot build> is the conda package's file name without `.conda` (its conda-meta name). conda-forge's
#   linux-sysroot-feedstock repackages AlmaLinux's binary RPMs unchanged; its recipe (info/recipe/meta.yaml in the
#   package) names their version, and the source file is AlmaLinux's source RPM of that version.
# - The pin is the vault's file, checked against the vault's repodata (repodata/*-primary.xml.gz); the URLs are
#   byte-identical copies, tried in order like those of arrow-sources.lock.
# - A lock refresh that changes the sysroot build fails tools/ci/tests/test_static_sources.py until its line is here
#   (docs/recipes/dependency-update.md).
